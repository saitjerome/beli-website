<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- Gear icon -->
  <g transform="translate(200,150)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#0d4f8b" stroke-width="6"/>
    <circle cx="0" cy="0" r="16" fill="#0d4f8b"/>
    <!-- Gear teeth -->
    <rect x="-5" y="-48" width="10" height="16" rx="2" fill="#0d4f8b"/>
    <rect x="-5" y="32" width="10" height="16" rx="2" fill="#0d4f8b"/>
    <rect x="-48" y="-5" width="16" height="10" rx="2" fill="#0d4f8b"/>
    <rect x="32" y="-5" width="16" height="10" rx="2" fill="#0d4f8b"/>
    <rect x="26" y="-35" width="10" height="16" rx="2" fill="#0d4f8b" transform="rotate(45 31 -27)"/>
    <rect x="-36" y="19" width="10" height="16" rx="2" fill="#0d4f8b" transform="rotate(45 -31 27)"/>
    <rect x="19" y="26" width="16" height="10" rx="2" fill="#0d4f8b" transform="rotate(45 27 31)"/>
    <rect x="-35" y="-36" width="16" height="10" rx="2" fill="#0d4f8b" transform="rotate(45 -27 -31)"/>
  </g>
  <!-- Company name -->
  <text x="200" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#0d4f8b" letter-spacing="3">MENSATECH</text>
  <text x="200" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5a8ab5" letter-spacing="5">MÜHENDİSLİK</text>
  <!-- Accent line -->
  <rect x="140" y="274" width="120" height="3" rx="1.5" fill="#1a9c8f"/>
</svg>
