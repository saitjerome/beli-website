<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#ffffff"/>
  <!-- Industrial / wave symbol representing Körfez (Gulf) -->
  <g transform="translate(200,140)">
    <path d="M-40,-30 L0,-50 L40,-30 L40,10 L0,30 L-40,10 Z" fill="none" stroke="#003366" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-20,-15 L0,-25 L20,-15 L20,5 L0,15 L-20,5 Z" fill="#003366"/>
    <!-- Wave accent inside -->
    <path d="M-12,0 Q-6,-8 0,0 Q6,8 12,0" fill="none" stroke="#FF8C00" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Company name -->
  <text x="200" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#003366" letter-spacing="2">KÖRFEZ ETA</text>
  <text x="200" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#5a7da5" letter-spacing="5">MÜHENDİSLİK</text>
  <!-- Accent line -->
  <rect x="130" y="264" width="140" height="3" rx="1.5" fill="#FF8C00"/>
</svg>
